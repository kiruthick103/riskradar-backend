services:
  - type: web
    name: riskradar-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: riskradar-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: riskradar-db
    databaseName: riskradar
    user: riskradar
    plan: free
